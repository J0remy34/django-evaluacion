<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 40px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
        }

        .producto {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Catálogo de Productos</h1>

    <p>
        <a href="/productos/informacion/">Información</a>
    </p>

    {% for producto in productos %}
        <div class="producto">
            <h2>{{ producto.nombre }}</h2>
            <p>Categoría: {{ producto.categoria }}</p>
            <p>Precio: ${{ producto.precio }}</p>
        </div>
    {% endfor %}
</div>

</body>
</html>
